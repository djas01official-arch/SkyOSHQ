name: Finalize Drive bootstrap sync

on:
  push:
    branches:
      - sync/drive-nonprod-20260823

permissions:
  contents: write

env:
  PACKAGE_B64: 
  BOOTSTRAP_TS_B64: 
  BOOTSTRAP_SQL_B64: 
  MIGRATOR_TF_B64: 
  EXPECTED_LOCK_BLOB_SHA: 57e473c8efe3f9ffd7e10fac8306649559256fd7

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Restore reviewed Drive sources
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKAGE_B64" | base64 --decode > package.json
          mkdir -p database/scripts database/production infrastructure/terraform/environments/nonprod
          printf '%s' "$BOOTSTRAP_TS_B64" | base64 --decode > database/scripts/bootstrap-production-database-roles.ts
          printf '%s' "$BOOTSTRAP_SQL_B64" | base64 --decode > database/production/bootstrap-database-roles.sql
          printf '%s' "$MIGRATOR_TF_B64" | base64 --decode > infrastructure/terraform/environments/nonprod/migrator_job.tf
      - name: Generate and verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          actual="$(git hash-object pnpm-lock.yaml)"
          test "$actual" = "$EXPECTED_LOCK_BLOB_SHA" || {
            echo "Lockfile blob SHA mismatch: expected $EXPECTED_LOCK_BLOB_SHA, got $actual" >&2
            exit 1
          }
      - name: Commit verified Drive bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-drive-bootstrap-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml \
            database/scripts/bootstrap-production-database-roles.ts \
            database/production/bootstrap-database-roles.sql \
            infrastructure/terraform/environments/nonprod/migrator_job.tf \
            .github/workflows/sync-drive-bootstrap-finalize.yml
          git diff --cached --check
          git commit -m 'feat(infra): sync database role bootstrap from Drive'
          git push origin HEAD
