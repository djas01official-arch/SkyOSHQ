name: Task 6 format apply

on:
  push:
    branches:
      - feat/durable-ai-orchestration
    paths:
      - .github/workflows/task6-format-diff.yml

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier formatting
        shell: bash
        run: |
          pnpm exec prettier --write database/ai/durable-ai-budget-execution.ts database/ai/durable-ai-orchestration.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/ai/durable-ai-budget-execution.ts database/ai/durable-ai-orchestration.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ai): format durable orchestration"
          git push origin HEAD:${GITHUB_REF_NAME}
