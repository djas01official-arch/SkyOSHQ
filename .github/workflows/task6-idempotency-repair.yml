name: Task 6 idempotency repair

on:
  push:
    branches:
      - feat/durable-ai-orchestration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Task 6 branch
        uses: actions/checkout@v6
        with:
          ref: feat/durable-ai-orchestration

      - name: Patch Task 6 files
        shell: bash
        run: |
          sed -i '/^    if count != 1:$/i\    if label == "route-bound fixture source" and count == 0:\n        return text' .github/task6_idempotency_patch.py
          python .github/task6_idempotency_patch.py

      - name: Enable pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          database/ai/durable-ai-chat.ts
          database/tests/durable-ai-orchestration.integration.test.ts
          apps/web/app/ai/actions.ts
          apps/web/components/ai/ai-message-composer.tsx
          architecture/decisions/0010-durable-ai-orchestration.md

      - name: Commit Task 6 repair
        shell: bash
        run: |
          rm .github/task6_idempotency_patch.py .github/workflows/task6-idempotency-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            database/ai/durable-ai-chat.ts \
            database/tests/durable-ai-orchestration.integration.test.ts \
            apps/web/app/ai/actions.ts \
            apps/web/components/ai/ai-message-composer.tsx \
            architecture/decisions/0010-durable-ai-orchestration.md \
            .github/task6_idempotency_patch.py \
            .github/workflows/task6-idempotency-repair.yml
          git diff --cached --check
          git commit -m "fix(ai): make durable submissions idempotent"
          git push origin HEAD:feat/durable-ai-orchestration
