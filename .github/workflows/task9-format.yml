name: Task 9 Format

on:
  push:
    branches:
      - task-9-dr-db-load-qualification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: task-9-dr-db-load-qualification

      - name: Enable pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Task 9 files
        run: >-
          pnpm exec prettier --write
          database/operations/database-pool.ts
          database/tests/database-pool.test.ts
          docs/operations/database-dr-load-qualification-report.md
          docs/operations/database-load-qualification.md

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            database/operations/database-pool.ts \
            database/tests/database-pool.test.ts \
            docs/operations/database-dr-load-qualification-report.md \
            docs/operations/database-load-qualification.md
          git commit -m "Format Task 9 qualification files"
          git push origin HEAD:task-9-dr-db-load-qualification
